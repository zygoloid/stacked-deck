# Tests every push and pull request; on main, deploys the game's Cloud
# Functions, then its database rules, then the site (GitHub Pages), in that
# order. See "Deploying" in docs/online.md, including the one-off setup.
# Actions are pinned by commit (Dependabot keeps them current:
# .github/dependabot.yml).
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check the deploy (firebase deploy --dry-run); deploy nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm test
      - name: Install test tools
        # Install scripts are skipped: nothing here needs them.
        run: |
          (cd functions && npm ci --ignore-scripts)
          (cd test/emulator && npm ci --ignore-scripts)
          npm install --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node tools/ui-smoke.js
      - name: Emulator tests
        working-directory: test/emulator
        run: npm test && npm run test:browser
      - run: node tools/build-site.js

  # Only this job can get Google credentials: the Workload Identity
  # Federation provider accepts tokens only from this workflow on main, in
  # the production environment (docs/online.md).
  firebase:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE: test/emulator/node_modules/.bin/firebase
      PROJECT: zygoloid-github-io
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
    steps:
      # Only these hosts can be reached from this job, so a compromised
      # dependency can't send the Google token anywhere else. The list is
      # what StepSecurity observed a real deploy using. A deploy that fails
      # on a blocked host needs it added: the job's insights page (linked
      # from its log) names it. For example, if a runner image lacks Node 22,
      # setup-node will need its download hosts.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.googleapis.com:443
            github.com:443
            registry.npmjs.org:443
            zygoloid-stacked-deck.firebaseio.com:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Install firebase-tools and the functions' dependencies
        run: |
          (cd functions && npm ci --ignore-scripts)
          (cd test/emulator && npm ci --ignore-scripts)
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: stacked-deck-deploy@zygoloid-github-io.iam.gserviceaccount.com
      - name: Check the server's rules version
        run: node tools/check-rules-version.js "$($FIREBASE database:get /config/rulesVersion --instance zygoloid-stacked-deck --project $PROJECT)"
      # Functions first, so they know about anything the new rules accept.
      - name: Deploy functions
        run: $FIREBASE deploy --only functions:stacked-deck --project $PROJECT --non-interactive $DRY_RUN
      - name: Deploy database rules
        run: $FIREBASE deploy --only database:stacked-deck --project $PROJECT --non-interactive $DRY_RUN

  pages:
    needs: firebase
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node tools/build-site.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
