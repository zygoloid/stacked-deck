# Tests every push and pull request; on main, deploys the game's Cloud
# Functions, then its database rules, then the site (GitHub Pages), in that
# order. See "Deploying" in docs/online.md, including the one-off setup.
# Actions are pinned by commit (Dependabot keeps them current:
# .github/dependabot.yml).
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check the deploy (firebase deploy --dry-run); deploy nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm test
      - name: Install test tools
        # Install scripts are skipped: nothing here needs them.
        run: |
          (cd functions && npm ci --ignore-scripts)
          (cd test/emulator && npm ci --ignore-scripts)
          npm install --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node tools/ui-smoke.js
      - name: Emulator tests
        working-directory: test/emulator
        run: npm test && npm run test:browser
      - run: node tools/build-site.js

  # Only this job can get Google credentials: the Workload Identity
  # Federation provider accepts tokens only from this workflow on main, in
  # the production environment (docs/online.md).
  firebase:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE: test/emulator/node_modules/.bin/firebase
      PROJECT: zygoloid-github-io
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
    steps:
      # Watches (and, with egress-policy: block, limits) the hosts this job
      # contacts, so a compromised dependency can't send the Google token
      # anywhere else. It starts in audit mode: after the first real deploy,
      # check the job's insights page (linked from its log) against
      # allowed-endpoints, then switch to block (docs/online.md, "Deploying").
      # allowed-endpoints only applies in block mode.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            *.googleapis.com:443
            zygoloid-stacked-deck.firebaseio.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install firebase-tools and the functions' dependencies
        run: |
          (cd functions && npm ci --ignore-scripts)
          (cd test/emulator && npm ci --ignore-scripts)
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: stacked-deck-deploy@zygoloid-github-io.iam.gserviceaccount.com
      - name: Check the server's rules version
        run: node tools/check-rules-version.js "$($FIREBASE database:get /config/rulesVersion --instance zygoloid-stacked-deck --project $PROJECT)"
      # Functions first, so they know about anything the new rules accept.
      - name: Deploy functions
        run: $FIREBASE deploy --only functions:stacked-deck --project $PROJECT --non-interactive $DRY_RUN
      - name: Deploy database rules
        run: $FIREBASE deploy --only database:stacked-deck --project $PROJECT --non-interactive $DRY_RUN

  pages:
    needs: firebase
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/build-site.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
